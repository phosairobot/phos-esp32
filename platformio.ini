; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<diagnostics/>
; Set to 1 only for the on-device A/B test. Solid frames then use the same
; fixed NeoPixel global brightness path as esp32_led_test.
; This 0.25 ceiling is a temporary hardware-stability mitigation, not a fix
; for the underlying power or signal-integrity issue.
build_flags =
    -D PHOS_LED_STANDALONE_SOLID_AB=0
    -D PHOS_LED_STANDALONE_BRIGHTNESS=40
    -D PHOS_LED_MAX_BRIGHTNESS=0.25F
    -D PHOS_LED_DEFAULT_BRIGHTNESS=0.15F
; Temporary controller/MPU diagnosis. Both stay off in production builds.
    -D PHOS_CONTROLLER_DIAGNOSTICS=0
    -D PHOS_MPU_DISABLE_MOTION_REPORTING=0

lib_deps =
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit CCS811 Library
    adafruit/Adafruit MPU6050
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit BusIO
    adafruit/Adafruit NeoPixel @ ^1.12.5
    bblanchon/ArduinoJson @ ^7.4.2

; Standalone WS2812B hardware diagnostic. The source filter links only this
; file, so no PHOS firmware source is present in this image.
[env:esp32_led_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    -<*>
    +<diagnostics/led_standalone/main.cpp>
; Change these values here to match a different ring/wiring diagnostic setup.
build_flags =
    -D LED_TEST_PIN=19
    -D LED_TEST_COUNT=12
    -D LED_TEST_COLOR_ORDER=NEO_GRB
    -D LED_TEST_SIGNAL_FREQUENCY=NEO_KHZ800
    -D LED_TEST_BRIGHTNESS=40
    -D LED_TEST_NORMAL_CYCLES_BEFORE_DIAGNOSTICS=3
    -D LED_TEST_DIAGNOSTICS=1
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.5
